<div class="header-container">
    <div class="header-left">
        <a href="/" class="brand-link" aria-label="TeamSync home">
            <img src="/assets/team-sync-logo.png" alt="" class="brand-logo">
            <span class="brand-info">
                <span class="brand-name">TeamSync</span>
                <span class="brand-subtitle">Campus Studio</span>
            </span>
        </a>
    </div>

    <div class="header-center">
        <div class="term-selector">
            <span class="term-status-dot" aria-hidden="true"></span>
            <button class="term-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false">
                <span>Fall 2026 <span aria-hidden="true">·</span> Term 1</span>
                <span class="icon-chevron" aria-hidden="true"></span>
            </button>
        </div>

        <label class="search-bar">
            <span class="icon-search" aria-hidden="true"></span>
            <input type="search" placeholder="Search capstones, tasks, teammates or resources..."
                aria-label="Global Search">
        </label>
    </div>

    <div class="header-right">
        <button class="btn btn-primary-pill" type="button" data-create-task>
            <span>Create Task</span>
            <span class="btn-arrow-circle" aria-hidden="true">
                <span class="icon-arrow"></span>
            </span>
        </button>

        <span class="header-divider" aria-hidden="true"></span>

        <a class="user-avatar-btn" href="/auth-pages/login.html" aria-label="Sign in or view your profile">
            <span class="avatar-initials">KM</span>
            <span class="online-status-dot" title="Online"></span>
        </a>
    </div>
</div>
